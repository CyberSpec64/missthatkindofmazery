<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cursor Maze Pro</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background: radial-gradient(circle at center, #1e1b4b 0%, #0f172a 100%);
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .header {
      margin-bottom: 14px;
      text-align: center;
    }

    .header h1 {
      font-size: 2.2rem;
      font-weight: 800;
      background: linear-gradient(135deg, #818cf8 0%, #c084fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 4px;
    }

    /* Controls Bar */
    .bar {
      display: flex;
      gap: 16px;
      align-items: center;
      margin-bottom: 12px;
      background: rgba(30, 41, 59, 0.7);
      padding: 8px 16px;
      border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(8px);
    }

    .select-wrap label {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-right: 6px;
    }

    select {
      background: #0f172a;
      color: #38bdf8;
      border: 1px solid #334155;
      padding: 4px 10px;
      border-radius: 6px;
      font-weight: 600;
      outline: none;
      cursor: pointer;
    }

    .stat-box {
      font-size: 0.9rem;
      font-weight: 600;
      color: #e2e8f0;
    }

    .stat-val {
      color: #38bdf8;
      font-family: monospace;
      font-size: 1rem;
    }

    /* Game Stage */
    .game-container {
      position: relative;
      width: 600px;
      height: 400px;
      background-color: #020617;
      border: 3px solid #334155;
      border-radius: 12px;
      box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.7);
      cursor: crosshair;
      overflow: hidden;
    }

    canvas {
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    #fxCanvas {
      pointer-events: none;
      z-index: 3;
    }

    /* Start / Exit Zones */
    .zone {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 0.7rem;
      letter-spacing: 1px;
      border-radius: 4px;
      z-index: 2;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    #start {
      top: 2px;
      left: 2px;
      background: #3b82f6;
      color: #fff;
      box-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
    }

    #start:hover {
      transform: scale(1.05);
    }

    #exit {
      bottom: 2px;
      right: 2px;
      background: #10b981;
      color: #fff;
      opacity: 0.4;
      pointer-events: none;
      box-shadow: 0 0 10px rgba(16, 185, 129, 0.2);
    }

    #exit.active {
      opacity: 1;
      pointer-events: auto;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
      70% { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
      100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }

    /* Overlay Screens */
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(2, 6, 23, 0.9);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      backdrop-filter: blur(4px);
    }

    .overlay.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .overlay h2 {
      font-size: 2.8rem;
      font-weight: 900;
      margin-bottom: 8px;
    }

    .overlay.win h2 { color: #34d399; text-shadow: 0 0 20px rgba(52, 211, 153, 0.4); }
    .overlay.lose h2 { color: #f87171; text-shadow: 0 0 20px rgba(248, 113, 113, 0.4); }

    .overlay p {
      color: #94a3b8;
      margin-bottom: 20px;
    }

    .btn-group {
      display: flex;
      gap: 12px;
    }

    .btn {
      padding: 10px 22px;
      font-size: 0.95rem;
      font-weight: 700;
      background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(79, 70, 229, 0.4);
      transition: transform 0.1s, background 0.2s;
    }

    .btn:hover { transform: translateY(-2px); }
    .btn.sec { background: #334155; box-shadow: none; }
    .btn.sec:hover { background: #475569; }

    .status {
      margin-top: 12px;
      font-size: 1rem;
      font-weight: 600;
      height: 24px;
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>Cursor Maze Pro</h1>
  </div>

  <div class="bar">
    <div class="select-wrap">
      <label for="diff">Difficulty:</label>
      <select id="diff" onchange="generateNewMaze()">
        <option value="easy">Easy</option>
        <option value="medium" selected>Medium</option>
        <option value="hard">Hard</option>
        <option value="insane">Insane</option>
      </select>
    </div>
    <div class="stat-box">Time: <span class="stat-val" id="time-val">0.00s</span></div>
    <div class="stat-box">Best: <span class="stat-val" id="best-val">--</span></div>
  </div>

  <div class="game-container" id="game-container">
    <div id="start" class="zone">START</div>
    <div id="exit" class="zone">EXIT</div>
    
    <canvas id="mazeCanvas" width="600" height="400"></canvas>
    <canvas id="fxCanvas" width="600" height="400"></canvas>

    <div class="overlay" id="overlay">
      <h2 id="overlay-title">Game Over</h2>
      <p id="overlay-msg">Wall contact detected!</p>
      <div class="btn-group">
        <button class="btn" onclick="retryMaze()">Try Again</button>
        <button class="btn sec" onclick="generateNewMaze()">New Layout</button>
      </div>
    </div>
  </div>

  <div class="status" id="status-text">Hover over START to launch</div>

  <script>
    // Audio Synthesizer (Web Audio API)
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) audioCtx = new AudioCtx();
    }

    function playTone(freq, type, duration) {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    function soundStart() { playTone(440, 'sine', 0.1); }
    function soundWin() { 
      playTone(523.25, 'triangle', 0.15);
      setTimeout(() => playTone(659.25, 'triangle', 0.15), 100);
      setTimeout(() => playTone(783.99, 'triangle', 0.3), 200);
    }
    function soundLose() { playTone(120, 'sawtooth', 0.3); }

    // Maze Core
    const canvas = document.getElementById('mazeCanvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const fxCanvas = document.getElementById('fxCanvas');
    const fxCtx = fxCanvas.getContext('2d');
    
    const container = document.getElementById('game-container');
    const startZone = document.getElementById('start');
    const exitZone = document.getElementById('exit');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlay-title');
    const overlayMsg = document.getElementById('overlay-msg');
    const statusText = document.getElementById('status-text');
    const timeVal = document.getElementById('time-val');
    const bestVal = document.getElementById('best-val');

    const width = 600;
    const height = 400;

    const diffConfigs = {
      easy:   { cols: 9,  rows: 6,  wallThickness: 10 },
      medium: { cols: 15, rows: 10, wallThickness: 6 },
      hard:   { cols: 21, rows: 14, wallThickness: 4 },
      insane: { cols: 30, rows: 20, wallThickness: 3 }
    };

    let grid = [], cols, rows, cellW, cellH, wallThickness;
    let isPlaying = false, startTime = 0, timerInterval = null, particles = [];

    class Cell {
      constructor(c, r) {
        this.c = c;
        this.r = r;
        this.walls = [true, true, true, true]; // T, R, B, L
        this.visited = false;
      }

      getUnvisitedNeighbor() {
        let n = [];
        let { c, r } = this;
        let top = grid[index(c, r - 1)];
        let right = grid[index(c + 1, r)];
        let bottom = grid[index(c, r + 1)];
        let left = grid[index(c - 1, r)];

        if (top && !top.visited) n.push(top);
        if (right && !right.visited) n.push(right);
        if (bottom && !bottom.visited) n.push(bottom);
        if (left && !left.visited) n.push(left);

        return n.length > 0 ? n[Math.floor(Math.random() * n.length)] : undefined;
      }
    }

    function index(c, r) {
      if (c < 0 || r < 0 || c >= cols || r >= rows) return -1;
      return c + r * cols;
    }

    function removeWalls(a, b) {
      let x = a.c - b.c;
      if (x === 1) { a.walls[3] = false; b.walls[1] = false; }
      else if (x === -1) { a.walls[1] = false; b.walls[3] = false; }
      let y = a.r - b.r;
      if (y === 1) { a.walls[0] = false; b.walls[2] = false; }
      else if (y === -1) { a.walls[2] = false; b.walls[0] = false; }
    }

    function generateMaze() {
      const diff = document.getElementById('diff').value;
      const config = diffConfigs[diff];
      cols = config.cols;
      rows = config.rows;
      wallThickness = config.wallThickness;
      cellW = width / cols;
      cellH = height / rows;

      // Adjust start and exit zone size visually
      startZone.style.width = `${cellW - 4}px`;
      startZone.style.height = `${cellH - 4}px`;
      exitZone.style.width = `${cellW - 4}px`;
      exitZone.style.height = `${cellH - 4}px`;

      grid = [];
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          grid.push(new Cell(c, r));
        }
      }

      let current = grid[0];
      current.visited = true;
      let stack = [];

      while (true) {
        let next = current.getUnvisitedNeighbor();
        if (next) {
          next.visited = true;
          stack.push(current);
          removeWalls(current, next);
          current = next;
        } else if (stack.length > 0) {
          current = stack.pop();
        } else break;
      }

      drawMaze();
      updateBestDisplay();
    }

    function drawMaze() {
      ctx.clearRect(0, 0, width, height);
      ctx.fillStyle = '#020617';
      ctx.fillRect(0, 0, width, height);

      ctx.strokeStyle = '#f43f5e';
      ctx.lineWidth = wallThickness;
      ctx.lineCap = 'round';

      for (let cell of grid) {
        let x = cell.c * cellW;
        let y = cell.r * cellH;

        ctx.beginPath();
        if (cell.walls[0]) { ctx.moveTo(x, y); ctx.lineTo(x + cellW, y); }
        if (cell.walls[1]) { ctx.moveTo(x + cellW, y); ctx.lineTo(x + cellW, y + cellH); }
        if (cell.walls[2]) { ctx.moveTo(x + cellW, y + cellH); ctx.lineTo(x, y + cellH); }
        if (cell.walls[3]) { ctx.moveTo(x, y + cellH); ctx.lineTo(x, y); }
        ctx.stroke();
      }
    }

    // Particle FX Engine
    function spawnParticles(x, y, color) {
      for (let i = 0; i < 25; i++) {
        particles.push({
          x, y,
          vx: (Math.random() - 0.5) * 8,
          vy: (Math.random() - 0.5) * 8,
          size: Math.random() * 4 + 2,
          color,
          life: 1
        });
      }
    }

    function updateParticles() {
      fxCtx.clearRect(0, 0, width, height);
      particles.forEach((p, i) => {
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.03;
        fxCtx.fillStyle = p.color;
        fxCtx.globalAlpha = Math.max(0, p.life);
        fxCtx.beginPath();
        fxCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        fxCtx.fill();
        if (p.life <= 0) particles.splice(i, 1);
      });
      requestAnimationFrame(updateParticles);
    }
    updateParticles();

    // Game Logic
    function checkCollision(e) {
      if (!isPlaying) return;

      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

      if (x < 0 || y < 0 || x >= width || y >= height) {
        endGame(false, "Out of bounds!");
        return;
      }

      const pData = ctx.getImageData(x - 1, y - 1, 3, 3).data;
      for (let i = 0; i < pData.length; i += 4) {
        if (pData[i] > 180 && pData[i + 1] < 100) { // Red wall match
          spawnParticles(x, y, '#f43f5e');
          endGame(false, "Wall contact detected!");
          break;
        }
      }
    }

    startZone.addEventListener('mouseenter', () => {
      initAudio();
      if (!isPlaying) {
        isPlaying = true;
        soundStart();
        exitZone.classList.add('active');
        statusText.textContent = "Run in progress...";
        statusText.style.color = "#38bdf8";
        startTime = Date.now();
        timerInterval = setInterval(() => {
          timeVal.textContent = ((Date.now() - startTime) / 1000).toFixed(2) + 's';
        }, 10);
      }
    });

    exitZone.addEventListener('mouseenter', (e) => {
      if (isPlaying) {
        const rect = canvas.getBoundingClientRect();
        spawnParticles(e.clientX - rect.left, e.clientY - rect.top, '#34d399');
        endGame(true);
      }
    });

    container.addEventListener('mousemove', checkCollision);
    container.addEventListener('mouseleave', () => {
      if (isPlaying) endGame(false, "Left game screen!");
    });

    function endGame(isWin, customMsg) {
      isPlaying = false;
      clearInterval(timerInterval);
      exitZone.classList.remove('active');
      overlay.classList.add('visible');

      if (isWin) {
        soundWin();
        const finalTime = ((Date.now() - startTime) / 1000).toFixed(2);
        saveBest(finalTime);
        overlay.className = "overlay visible win";
        overlayTitle.textContent = "Clear!";
        overlayMsg.textContent = `Completed in ${finalTime}s`;
        statusText.textContent = "Victory!";
        statusText.style.color = "#34d399";
      } else {
        soundLose();
        overlay.className = "overlay visible lose";
        overlayTitle.textContent = "Failed";
        overlayMsg.textContent = customMsg || "Wall contact detected!";
        statusText.textContent = "Failed. Try again!";
        statusText.style.color = "#f87171";
      }
    }

    function saveBest(time) {
      const diff = document.getElementById('diff').value;
      const key = `best_maze_${diff}`;
      const best = localStorage.getItem(key);
      if (!best || parseFloat(time) < parseFloat(best)) {
        localStorage.setItem(key, time);
        updateBestDisplay();
      }
    }

    function updateBestDisplay() {
      const diff = document.getElementById('diff').value;
      const best = localStorage.getItem(`best_maze_${diff}`);
      bestVal.textContent = best ? `${best}s` : '--';
    }

    function retryMaze() {
      overlay.classList.remove('visible');
      statusText.textContent = "Hover over START to launch";
      statusText.style.color = "#94a3b8";
      timeVal.textContent = "0.00s";
    }

    function generateNewMaze() {
      retryMaze();
      generateMaze();
    }

    generateMaze();
  </script>
</body>
</html>
